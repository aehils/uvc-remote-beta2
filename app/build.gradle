plugins {
    id 'com.android.application'
}

android {
    namespace 'com.expiation.reemanremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.expiation.reemanremote'
        minSdk 24          // Android 7.0 and newer
        targetSdk 34
        versionCode 1
        versionName '0.1-beta'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
