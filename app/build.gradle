plugins {
    id 'com.android.application'
}

android {
    namespace 'com.expiation.reemanremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.expiation.reemanremote'
        minSdk 24          // Android 7.0 and newer
        targetSdk 34
        versionCode 2
        versionName '0.2-beta'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tests only: the app itself still ships with zero third-party libraries.
    testImplementation 'junit:junit:4.13.2'
}
